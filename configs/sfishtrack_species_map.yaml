# Correspondance entre les noms de catégories COCO de SFISHTRACK et les
# classes YOLO de configs/species.yaml.
#
# Confirmé le 2026-08-13 en inspectant les 54 fichiers réels
# (data/external/sfishtrack/SFISHTRACK/Annotations/video*.json) : une seule
# catégorie COCO par fichier, pas de distinction par espèce nulle part.
# Nommage incohérent selon le fichier : 53/54 utilisent "object", un seul
# (video001) utilise "fish" à la place (même sens) — les deux sont mappés
# ici pour ne perdre aucune annotation. Si un futur export SFISHTRACK
# ajoute des catégories par espèce, compléter/remplacer ces entrées en
# conséquence (relancer --check-only pour voir les nouveaux noms).
#
# Format : nom_categorie_coco: nom_classe_species_yaml
# (nom_classe_species_yaml doit être une valeur de configs/species.yaml
# names: — sinon convert_sfishtrack.py l'ignore avec un avertissement)

object: poisson
fish: poisson
