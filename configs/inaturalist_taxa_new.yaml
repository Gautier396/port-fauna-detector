# Taxons iNaturalist pour les 12 espèces de poissons de port ajoutées le
# 2026-08-12 (classes 13-24 de species.yaml). Fichier SÉPARÉ de
# configs/inaturalist_taxa.yaml volontairement : src/fetch_inaturalist_sam.py
# traite toutes les entrées d'un fichier taxa sans distinction, et
# réutiliser inaturalist_taxa.yaml aurait ré-écrasé les labels des 23
# classes déjà ré-annotées (SAM + révision manuelle) avec de nouvelles boxes
# SAM fraîches, effaçant tout ce travail. Ne PAS fusionner ce fichier dans
# inaturalist_taxa.yaml sans y réfléchir.

castagnole: ["Chromis chromis"]
oblade: ["Oblada melanura"]
bogue: ["Boops boops"]
sar_museau_noir: ["Diplodus vulgaris"]
sparaillon: ["Diplodus annularis"]
serran_chevrette: ["Serranus cabrilla"]
serran_ecriture: ["Serranus scriba"]
atherine: ["Atherina hepsetus", "Atherina boyeri"]
rouget: ["Mullus surmuletus", "Mullus barbatus"]
chinchard: ["Trachurus trachurus"]
vive: ["Trachinus draco"]
sole: ["Solea solea"]
