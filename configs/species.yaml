# Classes d'espèces cibles pour le fine-tuning YOLO.
#
# Recentré sur les POISSONS le 2026-08-12 (demande explicite) — les
# céphalopodes, crustacés, échinodermes (sauf oursins, gardés explicitement),
# mollusques et cnidaires précédemment présents ont été retirés, avec leurs
# données (images/labels purgés de data/inaturalist, data/roboflow,
# data/fathomnet). Toujours PROVISOIRE, à valider avec le Parc/les plongeurs.
#
# Classe 0 "poisson" : pas une espèce, une classe PARENTE générique.
# Historiquement (pipeline iNaturalist, retiré 2026-08-12 lors du pivot
# SFISHTRACK) peuplée en dupliquant chaque boîte d'espèce (classes 1-24)
# sous "poisson" en plus de l'espèce précise (src/add_fish_umbrella.py,
# supprimé avec le reste du pipeline iNaturalist). SFISHTRACK écrit
# directement en "poisson" (dataset mono-classe à ce jour -- catégorie COCO
# "object" ou "fish" selon le fichier, cf. COCO_NAME_TO_SPECIES_NAME dans
# src/convert_sfishtrack.py)
# -- pas de duplication en jeu actuellement. Les classes 1-24 (espèces) et
# 25-26 (oursins) n'ont plus de source de données active (cf. README Points
# ouverts).
names:
  0: poisson                     # classe parente générique

  # Poissons
  1: dorade_royale                # Sparus aurata
  2: bar_europeen                 # Dicentrarchus labrax (loup)
  3: mulet                        # Mugil cephalus
  4: sar_commun                   # Diplodus sargus
  5: girelle                      # Coris julis
  6: rascasse                     # Scorpaena scrofa
  7: congre                       # Conger conger
  8: murene                       # Muraena helena
  9: saupe                        # Sarpa salpa
  10: blennie                     # Blenniidae (famille)
  11: gobie                       # Gobiidae (famille)
  12: hippocampe                  # Hippocampus hippocampus / H. guttulatus
  13: castagnole                  # Chromis chromis
  14: oblade                      # Oblada melanura
  15: bogue                       # Boops boops
  16: sar_museau_noir             # Diplodus vulgaris
  17: sparaillon                  # Diplodus annularis
  18: serran_chevrette            # Serranus cabrilla
  19: serran_ecriture             # Serranus scriba
  20: atherine                    # Atherina hepsetus / A. boyeri
  21: rouget                      # Mullus surmuletus / M. barbatus
  22: chinchard                   # Trachurus trachurus
  23: vive                        # Trachinus draco
  24: sole                        # Solea solea

  # Échinodermes (exception gardée explicitement, hors périmètre "poissons")
  25: oursin_violet               # Paracentrotus lividus
  26: oursin_noir                 # Arbacia lixula
